<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>OG image — CyberEM</title>
    <style>
      /* Tokens espejo de src/styles/global.css (file:// no puede importar el CSS del sitio). */
      :root {
        --bg-base: #09090b;
        --brand-500: #ff3241;
        --brand-glow: rgba(255, 50, 65, 0.35);
        --fg-strong: #fafafa;
        --fg-muted: #a1a1aa;
        --border-strong: rgba(250, 250, 250, 0.15);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: var(--bg-base);
        color: var(--fg-strong);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(var(--border-strong) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-strong) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
        opacity: 0.5;
      }
      .glow {
        position: absolute; right: -180px; top: -200px;
        width: 720px; height: 720px; border-radius: 50%;
        background: radial-gradient(circle, var(--brand-glow) 0%, transparent 65%);
        filter: blur(30px);
      }
      .brand { position: relative; display: flex; align-items: center; gap: 16px; }
      .mark {
        display: grid; place-items: center;
        width: 56px; height: 56px; border-radius: 12px;
        background: var(--brand-500);
        box-shadow: 0 8px 28px var(--brand-glow);
      }
      .name { font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace; font-size: 30px; letter-spacing: 0.1em; font-weight: 500; }
      .copy { position: relative; }
      .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 8px 16px; border: 1px solid var(--border-strong); border-radius: 999px;
        font-size: 20px; color: var(--fg-muted); margin-bottom: 28px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-500); box-shadow: 0 0 12px var(--brand-500); }
      h1 { font-size: 72px; line-height: 1.05; letter-spacing: -0.03em; max-width: 980px; font-weight: 600; }
      h1 span { background: linear-gradient(90deg, #fafafa 0%, #d4d4d8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .foot { position: relative; display: flex; justify-content: space-between; align-items: center; color: var(--fg-muted); font-size: 22px; }
      .url { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v6c0 4.5 3 8.25 7.5 9 4.5-.75 7.5-4.5 7.5-9V6L12 3z"/></svg>
      </div>
      <div class="name">CyberEM</div>
    </div>

    <div class="copy">
      <div class="pill"><span class="dot"></span>SOC · Detección y Respuesta · MDR</div>
      <h1><span>Plataforma SOC: detección, investigación y respuesta ante amenazas.</span></h1>
    </div>

    <div class="foot">
      <span>Monitoreo 24/7 · MITRE ATT&amp;CK · Multi-tenant para MSP</span>
      <span class="url">ciberem.com</span>
    </div>
  </body>
</html>
