          - generic [ref=e1022]:
            - generic [ref=e1024] [cursor=pointer]: Solutions
            - heading "Networking" [level=2] [ref=e1025]
            - paragraph [ref=e1026]: At Rep, we offer a comprehensive range of networking services.
          - generic [ref=e1029]:
            - generic [ref=e1031]:
              - img [ref=e1033]
              - generic [ref=e1037]: Infrastructure
              - paragraph [ref=e1038]: Build a secure, high-performance IT foundation with our tailored infrastructure solutions. We ensure seamless connectivity, scalability, and reliability to support your business operations without downtime or security risks.
            - generic [ref=e1040]:
              - img [ref=e1042]
              - generic [ref=e1047]: CCTV
              - paragraph [ref=e1048]: Protect your business with advanced CCTV solutions. Our high-resolution cameras, remote monitoring, and intelligent analytics provide real-time surveillance, deterring threats and ensuring safety for your assets and personnel.
            - generic [ref=e1050]:
              - img [ref=e1052]
              - generic [ref=e1061]: VoIP
              - paragraph [ref=e1062]: Enhance communication with crystal-clear VoIP solutions. Our secure, cost-effective voice services ensure reliable connections, seamless integrations, and advanced features for businesses of all sizes, improving collaboration and efficiency.
            - generic [ref=e1064]:
              - img [ref=e1066]
              - generic [ref=e1074]: Data Center
              - paragraph [ref=e1075]: Optimize performance and security with our data center solutions. From efficient cooling to secure storage and high-speed connectivity, we design and implement scalable environments tailored to your business needs.
            - generic [ref=e1077]:
              - img [ref=e1079]
              - generic [ref=e1084]: Virtualization
              - paragraph [ref=e1085]: Maximize efficiency with our virtualization solutions. Reduce hardware costs, enhance security, and improve scalability with flexible, cloud-ready environments designed to optimize performance and resource utilization.
            - generic [ref=e1087]:
              - img [ref=e1089]
              - generic [ref=e1098]: Routing & Switching
              - paragraph [ref=e1099]: Ensure fast, reliable network performance with advanced routing and switching solutions. We provide seamless connectivity, traffic optimization, and security to keep your business running smoothly and efficiently.
        - generic [ref=e1100]:
          - generic [ref=e1102]:
            - generic [ref=e1104] [cursor=pointer]: Solutions
            - heading "Security" [level=2] [ref=e1105]
            - paragraph [ref=e1106]: At Rep, we offer a comprehensive range of Security services.
          - generic [ref=e1109]:
            - generic [ref=e1111]:
              - img [ref=e1113]
              - generic [ref=e1117]: Firewalls
              - paragraph [ref=e1118]: Protect your network with advanced firewalls that block unauthorized access, filter traffic, and prevent cyber threats. Our solutions provide robust security without compromising performance or connectivity.
            - generic [ref=e1120]:
              - img [ref=e1122]
              - generic [ref=e1127]: Intrusion Detection and Prevention
              - paragraph [ref=e1128]: Stay ahead of cyber threats with real-time intrusion detection and prevention. Our solutions monitor, analyze, and stop malicious activity before it impacts your business operations.
            - generic [ref=e1130]:
              - img [ref=e1132]
              - generic [ref=e1141]: VPN Solutions
              - paragraph [ref=e1142]: Ensure secure remote access with our VPN solutions. Encrypt data, protect communications, and enable seamless connectivity for remote teams without sacrificing security or performance.
            - generic [ref=e1144]:
              - img [ref=e1146]
              - generic [ref=e1154]: Infrastructure and Physical Security
              - paragraph [ref=e1155]: Safeguard your digital and physical assets with integrated security solutions. From access control to cybersecurity, we provide a comprehensive approach to protecting your infrastructure.
            - generic [ref=e1157]:
              - img [ref=e1159]
              - generic [ref=e1164]: Availability and Resiliency
              - paragraph [ref=e1165]: Keep your business running with high-availability solutions. Our resiliency strategies minimize downtime, ensure redundancy, and protect critical systems from failures or cyberattacks.
